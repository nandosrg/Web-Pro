<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Daftar PRODUK</title>

  <style>
    body  { font-family: Arial, sans-serif; background-color: #f8f9fa; }
    div   { border: 2px solid black; padding: 8px; background-color: white; }
    table { width: 100%; border-collapse: collapse; border: 2px solid black; }
    th, td { border: 1px solid black; padding: 10px; }
    h2    { margin: 0; }
    ul    { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>

  <div>
    <table>
      <tr>
        <th colspan="3" bgcolor="#f8b422">
          <h2>Daftar PRODUK</h2>
        </th>
      </tr>

      <tr>
        <td rowspan="3" width="30%" align="center" bgcolor="yellow">
          <img src="foto.png" alt="Nubia Neo 2 5G" height="200">
        </td>
        <td width="20%" bgcolor="lime"><b>Nama Produk</b></td>
        <td width="50%" bgcolor="pink">Canon EOS M10 Kit EF-M 15-45mm</td>
      </tr>
      <tr>
        <td bgcolor="lime"><b>Harga</b></td>
        <td bgcolor="pink">Rp 4,899,000</td>
      </tr>
      <tr>
        <td bgcolor="lime"><b>Fitur Produk</b></td>
        <td bgcolor="pink">
          <ul>
            <li>Kamera mirrorless</li>
            <li>Efektifitas Piksel : 18 MP</li>
            <li>Tipe sensor : CMOS DIGIC 6</li>
            <li>Layar : 3.0 Inch</li>
            <li>Memiliki lampu flash dengan jarak jangkauan hingga 5 meter</li>
          </ul>
        </td>
      </tr>

    </table>
  </div>

</body>
</html>
